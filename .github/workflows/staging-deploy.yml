name: Staging Deploy

on:
  pull_request:
    types: [opened, synchronize]
    branches: [staging]
  push:
    branches: [staging]

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.STAGING_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: talent_assessment_staging
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqlnd, zip, gd, curl, fileinfo, openssl, tokenizer, json, bcmath, dom, filter, hash, libxml, session, simplexml, spl, xmlreader, xmlwriter, phar, iconv, curl, fileinfo, openssl, tokenizer, json, bcmath, dom, filter, hash, libxml, session, simplexml, spl, xmlreader, xmlwriter, phar
        coverage: none

    - name: Install MySQL Client
      run: sudo apt-get update && sudo apt-get install -y mysql-client

    - name: Setup Staging Testing Environment
      env:
        STAGING_DB_ROOT_PASSWORD: ${{ secrets.STAGING_DB_ROOT_PASSWORD }}
        STAGING_REDIS_PASSWORD: ${{ secrets.STAGING_REDIS_PASSWORD }}
        STAGING_S3_BUCKET: ${{ secrets.STAGING_S3_BUCKET }}
      run: |
        # Create a clean .env file for testing (don't copy from .env.example)
        echo 'APP_NAME="Talent Assessment"' > .env.staging.testing
        echo 'APP_ENV=staging' >> .env.staging.testing
        echo 'APP_DEBUG=true' >> .env.staging.testing
        echo 'APP_URL=http://localhost:8000' >> .env.staging.testing
        echo 'APP_LOG_LEVEL=debug' >> .env.staging.testing
        echo '' >> .env.staging.testing
        echo 'DB_CONNECTION=mysql' >> .env.staging.testing
        echo 'DB_HOST=127.0.0.1' >> .env.staging.testing
        echo 'DB_PORT=3306' >> .env.staging.testing
        echo 'DB_DATABASE=talent_assessment_staging' >> .env.staging.testing
        echo 'DB_USERNAME=root' >> .env.staging.testing
        echo "DB_PASSWORD=$STAGING_DB_ROOT_PASSWORD" >> .env.staging.testing
        echo '' >> .env.staging.testing
        echo 'BROADCAST_DRIVER=log' >> .env.staging.testing
        echo 'CACHE_DRIVER=file' >> .env.staging.testing
        echo 'SESSION_DRIVER=file' >> .env.staging.testing
        echo 'QUEUE_CONNECTION=sync' >> .env.staging.testing
        echo '' >> .env.staging.testing
        echo 'REDIS_HOST=127.0.0.1' >> .env.staging.testing
        echo "REDIS_PASSWORD=$STAGING_REDIS_PASSWORD" >> .env.staging.testing
        echo 'REDIS_PORT=6379' >> .env.staging.testing
        echo '' >> .env.staging.testing
        echo 'MAIL_DRIVER=smtp' >> .env.staging.testing
        echo 'MAIL_HOST=smtp.mailtrap.io' >> .env.staging.testing
        echo 'MAIL_PORT=2525' >> .env.staging.testing
        echo 'MAIL_USERNAME=null' >> .env.staging.testing
        echo 'MAIL_PASSWORD=null' >> .env.staging.testing
        echo 'MAIL_ENCRYPTION=null' >> .env.staging.testing
        echo '' >> .env.staging.testing
        echo 'AWS_REGION=us-east-2' >> .env.staging.testing
        echo "AWS_S3_BUCKET=$STAGING_S3_BUCKET" >> .env.staging.testing
        echo 'AWS_CLOUDFRONT_DOMAIN=dhbhjqoqdk3yk.cloudfront.net' >> .env.staging.testing
        echo 'AWS_SUPPRESS_PHP_DEPRECATION_WARNING=true' >> .env.staging.testing

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Clear All Caches
      run: |
        php artisan cache:clear
        php artisan config:clear
        php artisan route:clear
        php artisan view:clear
        composer dump-autoload

    - name: Wait for MySQL
      env:
        STAGING_DB_ROOT_PASSWORD: ${{ secrets.STAGING_DB_ROOT_PASSWORD }}
      run: |
        echo "Waiting for MySQL to be ready..."
        while ! mysqladmin ping -h"127.0.0.1" -P"3306" -uroot -p$STAGING_DB_ROOT_PASSWORD --silent; do
          sleep 1
        done
        echo "MySQL is ready!"

    - name: Setup Environment for Artisan
      run: cp .env.staging.testing .env

    - name: Update PHPUnit Configuration
      env:
        STAGING_DB_ROOT_PASSWORD: ${{ secrets.STAGING_DB_ROOT_PASSWORD }}
      run: |
        # Update phpunit.xml with correct database password
        sed -i "s/value=\"password\"/value=\"$STAGING_DB_ROOT_PASSWORD\"/g" phpunit.xml

    - name: Generate key
      run: php artisan key:generate

    - name: Run Migrations
      run: php artisan migrate --force



    - name: Execute tests (via phpunit)
      run: vendor/bin/phpunit --colors=never

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: []
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f Dockerfile -t $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG .
        docker push $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG
        echo "Image pushed: $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          cd /opt/talent-assessment
          
          echo "Starting staging deployment..."
          
          # Export environment variables
          export AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}
          export IMAGE_TAG=${{ github.sha }}
          export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          
          # Fetch secrets and set server environment variables
          echo "Fetching secrets from AWS Secrets Manager..."
          aws secretsmanager get-secret-value --secret-id talent-assessment-staging-secrets --region us-east-2 --query SecretString --output text > secrets.json
          
          # Set server environment variables for docker-compose
          echo "Setting server environment variables..."
          export STAGING_DB_DATABASE=$(jq -r '.STAGING_DB_DATABASE' secrets.json)
          export STAGING_DB_USERNAME=$(jq -r '.STAGING_DB_USERNAME' secrets.json)
          export STAGING_DB_PASSWORD=$(jq -r '.STAGING_DB_PASSWORD' secrets.json)
          export STAGING_DB_ROOT_PASSWORD=$(jq -r '.STAGING_DB_ROOT_PASSWORD' secrets.json)
          export STAGING_REDIS_PASSWORD=$(jq -r '.STAGING_REDIS_PASSWORD' secrets.json)
          export STAGING_S3_BUCKET=$(jq -r '.STAGING_S3_BUCKET' secrets.json)
          export STAGING_APP_KEY=$(jq -r '.STAGING_APP_KEY' secrets.json)
          
          # Generate APP_KEY if not exists
          if [ -z "$STAGING_APP_KEY" ] || [ "$STAGING_APP_KEY" = "null" ]; then
            export STAGING_APP_KEY="base64:$(openssl rand -base64 32)"
            echo "Generated new APP_KEY. Consider storing it in Secrets Manager."
          fi
          
          # Clean up secrets file
          rm secrets.json
          
          # Update image in docker-compose.staging.yml
          echo "Updating docker-compose.staging.yml with new image..."
          sed -i "/build:/,/dockerfile:/c\    image: $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG" docker-compose.staging.yml
          
          # Authenticate with ECR
          echo "Authenticating with ECR..."
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull new image and restart services
          echo "Pulling new image and restarting staging services..."
          docker-compose -f docker-compose.staging.yml pull
          docker-compose -f docker-compose.staging.yml up -d --force-recreate
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          sleep 30
          
          # Check service status
          echo "Checking service status..."
          docker-compose -f docker-compose.staging.yml ps
          
          # Run migrations
          echo "Running database migrations..."
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan migrate --force
          
          # Clear all caches
          echo "Clearing all caches..."
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan cache:clear
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan config:clear
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan route:clear
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan view:clear
          
          echo "Staging deployment completed successfully!"
          echo "Application URL: https://talent-staging.cyberworldbuilders.dev"
