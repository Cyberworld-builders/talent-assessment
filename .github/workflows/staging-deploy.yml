name: Staging Deploy

on:
  pull_request:
    types: [opened, synchronize]
    branches: [staging]
  push:
    branches: [staging]

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.STAGING_DB_ROOT_PASSWORD }}
          MYSQL_DATABASE: talent_assessment_staging
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '7.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqlnd, zip, gd, curl, fileinfo, openssl, tokenizer, json, bcmath, dom, filter, hash, libxml, session, simplexml, spl, xmlreader, xmlwriter, phar, iconv, curl, fileinfo, openssl, tokenizer, json, bcmath, dom, filter, hash, libxml, session, simplexml, spl, xmlreader, xmlwriter, phar
        coverage: none

    - name: Install MySQL Client
      run: sudo apt-get update && sudo apt-get install -y mysql-client

    - name: Setup Staging Testing Environment
      run: |
        cp .env.example .env.staging.testing
        echo "APP_ENV=staging" >> .env.staging.testing
        echo "APP_DEBUG=true" >> .env.staging.testing
        echo "APP_URL=http://localhost:8000" >> .env.staging.testing
        echo "DB_CONNECTION=mysql" >> .env.staging.testing
        echo "DB_HOST=127.0.0.1" >> .env.staging.testing
        echo "DB_PORT=3306" >> .env.staging.testing
        echo "DB_DATABASE=talent_assessment_staging" >> .env.staging.testing
        echo "DB_USERNAME=root" >> .env.staging.testing
        echo "DB_PASSWORD=${{ secrets.STAGING_DB_ROOT_PASSWORD }}" >> .env.staging.testing
        echo "REDIS_HOST=127.0.0.1" >> .env.staging.testing
        echo "REDIS_PORT=6379" >> .env.staging.testing
        echo "REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}" >> .env.staging.testing
        echo "CACHE_DRIVER=file" >> .env.staging.testing
        echo "SESSION_DRIVER=file" >> .env.staging.testing
        echo "QUEUE_CONNECTION=sync" >> .env.staging.testing
        echo "AWS_S3_BUCKET=${{ secrets.STAGING_S3_BUCKET }}" >> .env.staging.testing

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Clear All Caches
      run: |
        php artisan cache:clear
        php artisan config:clear
        php artisan route:clear
        php artisan view:clear
        composer dump-autoload

    - name: Wait for MySQL
      run: |
        echo "Waiting for MySQL to be ready..."
        while ! mysqladmin ping -h"127.0.0.1" -P"3306" -uroot -p${{ secrets.STAGING_DB_ROOT_PASSWORD }} --silent; do
          sleep 1
        done
        echo "MySQL is ready!"

    - name: Setup Environment for Artisan
      run: cp .env.staging.testing .env

    - name: Generate key
      run: php artisan key:generate

    - name: Run Migrations
      run: php artisan migrate --force

    - name: Execute tests (via phpunit)
      run: vendor/bin/phpunit --colors=never

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: []
    
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f Dockerfile -t $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG .
        docker push $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG
        echo "Image pushed: $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          cd /opt/talent-assessment
          
          echo "Starting staging deployment..."
          
          # Export environment variables
          export AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}
          export IMAGE_TAG=${{ github.sha }}
          export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          
          # Fetch secrets and generate .env.staging
          echo "Fetching secrets from AWS Secrets Manager..."
          aws secretsmanager get-secret-value --secret-id talent-assessment-staging-secrets --query SecretString --output text | jq -r > secrets.json
          
          echo "Generating .env.staging file..."
          cat > .env.staging << EOF
          APP_ENV=staging
          APP_DEBUG=false
          APP_URL=https://talent-staging.cyberworldbuilders.dev
          APP_KEY=base64:$(openssl rand -base64 32)
          
          DB_CONNECTION=mysql
          DB_HOST=mysql-staging
          DB_PORT=3306
          DB_DATABASE=$(jq -r '.STAGING_DB_DATABASE' secrets.json)
          DB_USERNAME=$(jq -r '.STAGING_DB_USERNAME' secrets.json)
          DB_PASSWORD=$(jq -r '.STAGING_DB_PASSWORD' secrets.json)
          
          REDIS_HOST=redis-staging
          REDIS_PORT=6379
          REDIS_PASSWORD=$(jq -r '.STAGING_REDIS_PASSWORD' secrets.json)
          
          CACHE_DRIVER=redis
          SESSION_DRIVER=redis
          QUEUE_CONNECTION=redis
          
          AWS_REGION=${{ vars.AWS_REGION }}
          AWS_S3_BUCKET=$(jq -r '.STAGING_S3_BUCKET' secrets.json)
          EOF
          
          # Set environment variables for docker-compose
          export STAGING_DB_DATABASE=$(jq -r '.STAGING_DB_DATABASE' secrets.json)
          export STAGING_DB_USERNAME=$(jq -r '.STAGING_DB_USERNAME' secrets.json)
          export STAGING_DB_PASSWORD=$(jq -r '.STAGING_DB_PASSWORD' secrets.json)
          export STAGING_DB_ROOT_PASSWORD=$(jq -r '.STAGING_DB_ROOT_PASSWORD' secrets.json)
          export STAGING_REDIS_PASSWORD=$(jq -r '.STAGING_REDIS_PASSWORD' secrets.json)
          
          # Clean up secrets file
          rm secrets.json
          
          # Update image in docker-compose.staging.yml
          echo "Updating docker-compose.staging.yml with new image..."
          sed -i "s|image:.*|image: $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG|g" docker-compose.staging.yml
          
          # Authenticate with ECR
          echo "Authenticating with ECR..."
          aws ecr get-login-password | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull new image and restart services
          echo "Pulling new image and restarting staging services..."
          docker-compose -f docker-compose.staging.yml pull
          docker-compose -f docker-compose.staging.yml up -d --force-recreate
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          sleep 30
          
          # Check service status
          echo "Checking service status..."
          docker-compose -f docker-compose.staging.yml ps
          
          echo "Staging deployment completed successfully!"
          echo "Application URL: https://talent-staging.cyberworldbuilders.dev"
