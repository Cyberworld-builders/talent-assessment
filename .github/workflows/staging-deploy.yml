name: Staging Deploy

on:
  pull_request:
    types: [opened, synchronize]
    branches: [staging]
  push:
    branches: [staging]

jobs:
  test:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/test-config.yml

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: []
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v4

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build and Push Image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        docker build -f Dockerfile -t $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG .
        docker push $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG
        echo "Image pushed: $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          cd /opt/talent-assessment
          
          echo "Starting staging deployment..."
          
          # Export environment variables
          export AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}
          export IMAGE_TAG=${{ github.sha }}
          export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          
          # Fetch secrets and set server environment variables
          echo "Fetching secrets from AWS Secrets Manager..."
          aws secretsmanager get-secret-value --secret-id talent-assessment-staging-secrets --region us-east-2 --query SecretString --output text > secrets.json
          
          # Set server environment variables for docker-compose
          echo "Setting server environment variables..."
          export STAGING_DB_DATABASE=$(jq -r '.STAGING_DB_DATABASE' secrets.json)
          export STAGING_DB_USERNAME=$(jq -r '.STAGING_DB_USERNAME' secrets.json)
          export STAGING_DB_PASSWORD=$(jq -r '.STAGING_DB_PASSWORD' secrets.json)
          export STAGING_DB_ROOT_PASSWORD=$(jq -r '.STAGING_DB_ROOT_PASSWORD' secrets.json)
          export STAGING_REDIS_PASSWORD=$(jq -r '.STAGING_REDIS_PASSWORD' secrets.json)
          export STAGING_S3_BUCKET=$(jq -r '.STAGING_S3_BUCKET' secrets.json)
          export STAGING_APP_KEY=$(jq -r '.STAGING_APP_KEY' secrets.json)
          
          # Generate APP_KEY properly (32-byte key encoded in base64, but shorter format like Laravel artisan)
          export STAGING_APP_KEY=$(openssl rand -base64 24 | tr -d '\n')
          echo "Generated APP_KEY: $STAGING_APP_KEY"
          
          # Clean up secrets file
          rm secrets.json
          
          # Set image environment variable
          echo "Setting image environment variable..."
          export STAGING_APP_IMAGE="$ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG"
          
          # Authenticate with ECR
          echo "Authenticating with ECR..."
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull new image and restart services
          echo "Pulling new image and restarting staging services..."
          docker-compose -f docker-compose.staging.yml pull
          docker-compose -f docker-compose.staging.yml up -d --force-recreate
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          sleep 30
          
          # Check service status
          echo "Checking service status..."
          docker-compose -f docker-compose.staging.yml ps
          
          # Clean up Docker resources
          echo "Cleaning up Docker resources..."
          docker system prune -f || echo "Docker cleanup failed, continuing..."
          docker image prune -f || echo "Docker image cleanup failed, continuing..."
          
          # Check disk usage
          DISK_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
          echo "Disk usage after cleanup: ${DISK_USAGE}%"
          
          if [ "$DISK_USAGE" -gt 85 ]; then
            echo "WARNING: Disk usage is still high (${DISK_USAGE}%). Consider manual cleanup or instance resize."
          fi
          
          # Configure Redis password
          echo "Configuring Redis password..."
          sleep 5
          docker-compose -f docker-compose.staging.yml exec -T redis-staging redis-cli CONFIG SET requirepass "$STAGING_REDIS_PASSWORD" || echo "Failed to configure Redis password, continuing..."
          
          # Run migrations
          echo "Running database migrations..."
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan migrate --force
          
          # Clear all caches
          echo "Clearing all caches..."
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan cache:clear
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan config:clear
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan route:clear
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan view:clear
          
          # Health check
          echo "Performing health check..."
          HEALTH_URL="https://talent-staging.cyberworldbuilders.dev"
          MAX_ATTEMPTS=30
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            if curl -f -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" | grep -q "200"; then
              echo "SUCCESS: Application is healthy! HTTP 200 received."
              break
            fi
            
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "ERROR: Application health check failed after $MAX_ATTEMPTS attempts."
              echo "Current service status:"
              docker-compose -f docker-compose.staging.yml ps
              echo "Recent application logs:"
              docker-compose -f docker-compose.staging.yml logs --tail=50 app-staging
              exit 1
            fi
            
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "Staging deployment completed successfully!"
          echo "Application URL: https://talent-staging.cyberworldbuilders.dev"
