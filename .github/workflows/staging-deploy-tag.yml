name: Staging Deploy (Tag-based)

on:
  push:
    tags:
      - '*-staging'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to deploy (e.g., v1.5.4-staging)'
        required: true
        default: 'v1.5.4-staging'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '6'
        cache: 'npm'

    - name: Install Node Dependencies
      run: npm install

    - name: Build Frontend Assets
      run: timeout 300 npm run gulp

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Check if Image Exists
      id: check-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      run: |
        echo "Checking if image $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG already exists..."
        if aws ecr describe-images --repository-name talent-assessment-app --image-ids imageTag=$IMAGE_TAG --region us-east-2 >/dev/null 2>&1; then
          echo "Image $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG already exists in ECR"
          echo "image_exists=true" >> $GITHUB_OUTPUT
        else
          echo "Image $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG does not exist in ECR"
          echo "image_exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build and Push Image
      if: steps.check-image.outputs.image_exists == 'false'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      run: |
        echo "Building and pushing new image: $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG"
        docker build -f Dockerfile.production -t $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG .
        docker push $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG
        echo "Image pushed: $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG"

    - name: Skip Build (Image Already Exists)
      if: steps.check-image.outputs.image_exists == 'true'
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      run: |
        echo "Skipping build - image $ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG already exists in ECR"
        echo "This deployment will use the existing image, which should speed up the deployment process"

    - name: Deploy to EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          cd /opt/talent-assessment
          
          echo "Starting staging deployment for tag: ${{ github.event.inputs.tag || github.ref_name }}"
          
          # Export environment variables
          export AWS_DEFAULT_REGION=${{ vars.AWS_REGION }}
          export IMAGE_TAG=${{ github.event.inputs.tag || github.ref_name }}
          export ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          
          # Fetch secrets and set server environment variables
          echo "Fetching secrets from AWS Secrets Manager..."
          aws secretsmanager get-secret-value --secret-id talent-assessment-staging-secrets --region us-east-2 --query SecretString --output text > secrets.json
          
          # Create .env.staging file if it doesn't exist
          if [ ! -f ".env.staging" ]; then
            echo "Creating .env.staging file from template..."
            cp .env.example .env.staging
          fi
          
          # Update .env.staging file with secrets
          echo "Updating .env.staging file with secrets..."
          sed -i "s/DB_DATABASE=.*/DB_DATABASE=$(jq -r '.STAGING_DB_DATABASE' secrets.json)/" .env.staging
          sed -i "s/DB_USERNAME=.*/DB_USERNAME=$(jq -r '.STAGING_DB_USERNAME' secrets.json)/" .env.staging
          sed -i "s/DB_PASSWORD=.*/DB_PASSWORD=$(jq -r '.STAGING_DB_PASSWORD' secrets.json)/" .env.staging
          sed -i "s/REDIS_PASSWORD=.*/REDIS_PASSWORD=null/" .env.staging
          sed -i "s/AWS_S3_BUCKET=.*/AWS_S3_BUCKET=$(jq -r '.STAGING_S3_BUCKET' secrets.json)/" .env.staging
          sed -i "s/AWS_REGION=.*/AWS_REGION=$(jq -r '.STAGING_SES_REGION' secrets.json)/" .env.staging
          sed -i "s/AWS_DEFAULT_REGION=.*/AWS_DEFAULT_REGION=$(jq -r '.STAGING_SES_REGION' secrets.json)/" .env.staging
          
          # Configure SES email (using IAM role-based authentication, no credentials needed)
          echo "Configuring SES email settings..."
          sed -i "s|MAIL_DRIVER=.*|MAIL_DRIVER=ses|" .env.staging
          sed -i "s|MAIL_FROM_ADDRESS=.*|MAIL_FROM_ADDRESS=$(jq -r '.STAGING_SES_FROM_ADDRESS' secrets.json)|" .env.staging
          sed -i "s|MAIL_FROM_NAME=.*|MAIL_FROM_NAME=\"Talent Assessment Staging\"|" .env.staging
          
          # Ensure SES config values exist (add if missing)
          if ! grep -q "^MAIL_DRIVER=" .env.staging; then
            echo "MAIL_DRIVER=ses" >> .env.staging
          fi
          if ! grep -q "^MAIL_FROM_ADDRESS=" .env.staging; then
            echo "MAIL_FROM_ADDRESS=$(jq -r '.STAGING_SES_FROM_ADDRESS' secrets.json)" >> .env.staging
          fi
          if ! grep -q "^MAIL_FROM_NAME=" .env.staging; then
            echo "MAIL_FROM_NAME=\"Talent Assessment Staging\"" >> .env.staging
          fi
          
          # Update APP_VERSION with the deployment tag
          echo "Updating APP_VERSION to: $IMAGE_TAG"
          if grep -q "APP_VERSION=" .env.staging; then
            sed -i "s|APP_VERSION=.*|APP_VERSION=$IMAGE_TAG|" .env.staging
          else
            echo "APP_VERSION=$IMAGE_TAG" >> .env.staging
          fi
          
          # Ensure AWS deprecation warning suppression is set
          if ! grep -q "AWS_SUPPRESS_PHP_DEPRECATION_WARNING" .env.staging; then
            echo "AWS_SUPPRESS_PHP_DEPRECATION_WARNING=true" >> .env.staging
          fi
          
          # Set environment variable for docker-compose image reference
          export STAGING_APP_IMAGE="$ECR_REGISTRY/talent-assessment-app:$IMAGE_TAG"
          
          # Update .env.staging with the new image tag
          sed -i "s|STAGING_APP_IMAGE=.*|STAGING_APP_IMAGE=$STAGING_APP_IMAGE|" .env.staging
          
          # Clean up secrets file
          rm secrets.json
          
          # SES configuration uses IAM role-based authentication (OIDC)
          echo "SES configuration will use IAM role-based authentication"
          
          # Authenticate with ECR
          echo "Authenticating with ECR..."
          aws ecr get-login-password --region us-east-2 | docker login --username AWS --password-stdin $ECR_REGISTRY
          
          # Pull new image and restart services
          echo "Pulling new image and restarting staging services..."
          docker-compose -f docker-compose.staging.yml pull
          docker-compose -f docker-compose.staging.yml up -d --force-recreate
          
          # Wait for services to be healthy
          echo "Waiting for services to be healthy..."
          sleep 30
          
          # Check service status
          echo "Checking service status..."
          docker-compose -f docker-compose.staging.yml ps
          
          # Generate APP_KEY using Laravel artisan command
          echo "Generating APP_KEY using Laravel artisan..."
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan key:generate
          
          # Extract the generated APP_KEY and update .env.staging file
          echo "Extracting generated APP_KEY and updating .env.staging..."
          # Read the APP_KEY from the container's environment and update the file
          GENERATED_KEY=$(docker-compose -f docker-compose.staging.yml exec -T app-staging printenv APP_KEY 2>/dev/null || echo "")
          if [ -n "$GENERATED_KEY" ]; then
            sed -i "s|APP_KEY=.*|APP_KEY=$GENERATED_KEY|" .env.staging
            echo "Updated .env.staging with generated APP_KEY: ${GENERATED_KEY:0:20}..."
          else
            echo "Warning: Could not extract generated APP_KEY from container environment"
          fi
          
          # Clean up Docker resources aggressively
          echo "Cleaning up Docker resources..."
          docker system prune -a -f || echo "Docker cleanup failed, continuing..."
          docker image prune -a -f || echo "Docker image cleanup failed, continuing..."
          docker volume prune -f || echo "Docker volume cleanup failed, continuing..."
          
          # Clean up system resources
          echo "Cleaning up system resources..."
          sudo apt-get clean || echo "APT cleanup failed, continuing..."
          sudo journalctl --vacuum-time=7d || echo "Journal cleanup failed, continuing..."
          
          # Truncate large log files if they exist
          echo "Cleaning up large log files..."
          sudo truncate -s 0 /var/log/health-check.log 2>/dev/null || echo "Health check log cleanup failed, continuing..."
          
          # Check disk usage
          DISK_USAGE=$(df / | tail -1 | awk '{print $5}' | sed 's/%//')
          echo "Disk usage after cleanup: ${DISK_USAGE}%"
          
          if [ "$DISK_USAGE" -gt 85 ]; then
            echo "WARNING: Disk usage is still high (${DISK_USAGE}%). Consider manual cleanup or instance resize."
          fi
          
          # Redis is configured without password
          echo "Redis configured without password authentication"
          
          # Run migrations
          echo "Running database migrations..."
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan migrate --force
          
          # Clear all caches
          echo "Clearing all caches..."
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan cache:clear
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan config:clear
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan route:clear
          docker-compose -f docker-compose.staging.yml exec -T app-staging php artisan view:clear
          

          
          # Health check
          echo "Performing health check..."
          HEALTH_URL="https://talent-staging.cyberworldbuilders.dev"
          MAX_ATTEMPTS=30
          ATTEMPT=1
          
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Health check attempt $ATTEMPT/$MAX_ATTEMPTS..."
            
            if curl -f -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" | grep -q "200\|302"; then
              http_code=$(curl -f -s -o /dev/null -w "%{http_code}" "$HEALTH_URL" 2>/dev/null || echo "000")
              echo "SUCCESS: Application is healthy! HTTP $http_code received."
              break
            fi
            
            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "ERROR: Application health check failed after $MAX_ATTEMPTS attempts."
              echo "Current service status:"
              docker-compose -f docker-compose.staging.yml ps
              echo "Recent application logs:"
              docker-compose -f docker-compose.staging.yml logs --tail=50 app-staging
              exit 1
            fi
            
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done
          
          echo "Staging deployment completed successfully!"
          echo "Application URL: https://talent-staging.cyberworldbuilders.dev"
          echo "Deployed version: ${{ github.event.inputs.tag || github.ref_name }}"
