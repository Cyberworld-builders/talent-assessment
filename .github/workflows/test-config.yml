name: Test Configuration

# This is a reusable workflow - not meant to be run directly
on:
  workflow_call:
    inputs:
      php-version:
        description: 'PHP version to use'
        required: false
        default: '7.4'
        type: string
      mysql-version:
        description: 'MySQL version to use'
        required: false
        default: '8.0'
        type: string
      database-name:
        description: 'Database name for testing'
        required: false
        default: 'testing'
        type: string
      database-password:
        description: 'Database password for testing'
        required: false
        default: 'password'
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:${{ inputs.mysql-version }}
        env:
          MYSQL_ROOT_PASSWORD: ${{ inputs.database-password }}
          MYSQL_DATABASE: ${{ inputs.database-name }}
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '${{ inputs.php-version }}'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqlnd, zip, gd, curl, fileinfo, openssl, tokenizer, json, bcmath, dom, filter, hash, libxml, session, simplexml, spl, xmlreader, xmlwriter, phar, iconv, curl, fileinfo, openssl, tokenizer, json, bcmath, dom, filter, hash, libxml, session, simplexml, spl, xmlreader, xmlwriter, phar
        coverage: none

    - name: Install MySQL Client
      run: sudo apt-get update && sudo apt-get install -y mysql-client

    - name: Setup Testing Environment
      run: |
        cp .env.example .env.testing
        sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=mysql_testing/' .env.testing
        sed -i 's/DB_HOST=.*/DB_HOST=127.0.0.1/' .env.testing
        sed -i 's/DB_DATABASE=.*/DB_DATABASE=${{ inputs.database-name }}/' .env.testing
        sed -i 's/DB_USERNAME=.*/DB_USERNAME=root/' .env.testing
        sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=${{ inputs.database-password }}/' .env.testing
        # Configure email for testing (using environment variables or defaults)
        sed -i 's/MAIL_DRIVER=.*/MAIL_DRIVER=smtp/' .env.testing
        sed -i 's/MAIL_HOST=.*/MAIL_HOST=sandbox.smtp.mailtrap.io/' .env.testing
        sed -i 's/MAIL_PORT=.*/MAIL_PORT=2525/' .env.testing
        sed -i 's/MAIL_USERNAME=.*/MAIL_USERNAME=${MAILTRAP_USERNAME:-test_username}/' .env.testing
        sed -i 's/MAIL_PASSWORD=.*/MAIL_PASSWORD=${MAILTRAP_PASSWORD:-test_password}/' .env.testing
        sed -i 's/MAIL_ENCRYPTION=.*/MAIL_ENCRYPTION=tls/' .env.testing

    - name: Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache

    - name: Clear All Caches
      run: |
        php artisan cache:clear
        php artisan config:clear
        php artisan route:clear
        php artisan view:clear
        composer dump-autoload

    - name: Wait for MySQL
      run: |
        echo "Waiting for MySQL to be ready..."
        while ! mysqladmin ping -h"127.0.0.1" -P"3306" -uroot -p${{ inputs.database-password }} --silent; do
          sleep 1
        done
        echo "MySQL is ready!"

    - name: Setup Environment for Artisan
      run: cp .env.testing .env

    - name: Generate key
      run: php artisan key:generate

    - name: Run Migrations
      run: php artisan migrate --force

    - name: Run Database Seeders
      run: php artisan db:seed --force

    - name: Execute tests (via phpunit)
      run: vendor/bin/phpunit --colors=never
