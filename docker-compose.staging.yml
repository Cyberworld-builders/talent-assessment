services:
  app-staging:
    image: ${STAGING_APP_IMAGE:-068732175988.dkr.ecr.us-east-2.amazonaws.com/talent-assessment-app:latest}
    container_name: talent-assessment-app-staging
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8003:8000"
    environment:
      # Application Configuration (hardcoded, version controlled)
      - APP_NAME="Talent Assessment"
      - APP_ENV=staging
      - APP_DEBUG=false
      - APP_URL=https://talent-staging.cyberworldbuilders.dev
      - APP_LOG_LEVEL=debug
      
      # Database Configuration (from server environment variables)
      - DB_CONNECTION=mysql
      - DB_DATABASE=${STAGING_DB_DATABASE}
      - DB_HOST=mysql-staging
      - DB_PORT=3306
      - DB_USERNAME=${STAGING_DB_USERNAME}
      - DB_PASSWORD=${STAGING_DB_PASSWORD}
      
      # Cache and Session Configuration (hardcoded)
      - BROADCAST_DRIVER=log
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=database
      - QUEUE_DRIVER=redis
      
      # Redis Configuration (from server environment variables)
      - REDIS_HOST=redis-staging
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${STAGING_REDIS_PASSWORD}
      
      # Mail Configuration (hardcoded)
      - MAIL_DRIVER=smtp
      - MAIL_HOST=smtp.mailtrap.io
      - MAIL_PORT=2525
      - MAIL_USERNAME=null
      - MAIL_PASSWORD=null
      - MAIL_ENCRYPTION=null
      
      # AWS Configuration (from server environment variables)
      - AWS_REGION=us-east-2
      - AWS_S3_BUCKET=${STAGING_S3_BUCKET}
      - AWS_CLOUDFRONT_DOMAIN=dhbhjqoqdk3yk.cloudfront.net
      - AWS_SUPPRESS_PHP_DEPRECATION_WARNING=true
      
      # Application Key (from server environment variables)
      - APP_KEY=${STAGING_APP_KEY}
    depends_on:
      - mysql-staging
      - redis-staging
    networks:
      - talent-network-staging
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.talent-staging-image.entrypoints=websecure"
      - "traefik.http.routers.talent-staging-image.rule=Host(`talent-staging.cyberworldbuilders.dev`)"
      - "traefik.http.routers.talent-staging-image.tls=true"
      - "traefik.http.routers.talent-staging-image.tls.certresolver=letsencrypt"
      - "traefik.http.services.talent-staging-image.loadbalancer.server.port=8000"

  mysql-staging:
    image: mysql:8.0
    container_name: talent-assessment-mysql-staging
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${STAGING_DB_DATABASE}
      MYSQL_USER: ${STAGING_DB_USERNAME}
      MYSQL_PASSWORD: ${STAGING_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${STAGING_DB_ROOT_PASSWORD}
    volumes:
      - mysql_data_staging:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - talent-network-staging

  redis-staging:
    image: redis:7-alpine
    container_name: talent-assessment-redis-staging
    restart: unless-stopped
    volumes:
      - redis_data_staging:/data
    networks:
      - talent-network-staging

volumes:
  mysql_data_staging:
  redis_data_staging:

networks:
  talent-network-staging:
    driver: bridge
  traefik-net:
    external: true
