version: "3.9"

services:
  app-staging:
    image: ${STAGING_APP_IMAGE}
    container_name: talent-assessment-app-staging
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "8003:8000"
    env_file:
      - .env.staging
    depends_on:
      - mysql-staging
      - redis-staging
    networks:
      - talent-network-staging
      - traefik-net
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik-net"
      - "traefik.http.routers.talent-staging-image.entrypoints=websecure"
      - "traefik.http.routers.talent-staging-image.rule=Host(`talent-staging.cyberworldbuilders.dev`)"
      - "traefik.http.routers.talent-staging-image.tls=true"
      - "traefik.http.routers.talent-staging-image.tls.certresolver=letsencrypt"
      - "traefik.http.services.talent-staging-image.loadbalancer.server.port=8000"

  mysql-staging:
    image: mysql:8.0
    container_name: talent-assessment-mysql-staging
    restart: unless-stopped
    env_file:
      - .env.staging
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data_staging:/var/lib/mysql
      - ./database/migrations:/docker-entrypoint-initdb.d
    networks:
      - talent-network-staging

  redis-staging:
    image: redis:7-alpine
    container_name: talent-assessment-redis-staging
    restart: unless-stopped
    volumes:
      - redis_data_staging:/data
    networks:
      - talent-network-staging

  pdf-worker-staging:
    image: ${STAGING_PDF_WORKER_IMAGE}
    container_name: talent-assessment-pdf-worker-staging
    restart: unless-stopped
    working_dir: /app
    env_file:
      - .env.staging
    depends_on:
      - mysql-staging
    networks:
      - talent-network-staging
    # Run in watch mode - processes pending reports every 30 seconds
    command: sh -c "while true; do node generate-pdf.js --batch; sleep 30; done"

volumes:
  mysql_data_staging:
  redis_data_staging:

networks:
  talent-network-staging:
    driver: bridge
  traefik-net:
    external: true
